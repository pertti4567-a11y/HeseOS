<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101522"><title>HeseOS Order</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101522;color:#f5f7fb}*{box-sizing:border-box}body{margin:0}.top{padding:22px 28px;background:#192235;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:28px}.layout{display:grid;grid-template-columns:1fr 340px;gap:20px;padding:20px}.categories{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 18px;background:#29364f;color:white}.categories button.active,.primary{background:#5678e8}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.product{background:#1b263a;border-radius:16px;padding:18px;min-height:145px;display:flex;flex-direction:column;justify-content:space-between}.product h3{margin:0 0 8px}.price{color:#b8c8ff;font-weight:700}.cart{background:#1b263a;border-radius:16px;padding:18px;height:max-content;position:sticky;top:16px}.cartline{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #34415a}.total{font-size:24px;font-weight:800;margin:20px 0}.muted{color:#aab5c9}.cart button{width:100%;margin-top:8px}.receipt{padding:30px;background:#1b263a;border-radius:16px;max-width:600px;margin:30px auto;text-align:center}.hidden{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.cart{position:static}.top{padding:16px}.top h1{font-size:22px}}
</style></head>
<body><header class="top"><h1>HeseOS <span class="muted">· Order here</span></h1><span id="clock"></span></header>
<main class="layout" id="ordering"><section><nav class="categories" id="categories"></nav><div class="products" id="products"></div></section><aside class="cart"><h2>Your order</h2><div id="cartlines" class="muted">Your cart is empty.</div><div class="total" id="total">€0.00</div><button class="primary" onclick="checkout()">Confirm order</button><button onclick="clearCart()">Clear cart</button><p class="muted">Demo mode: confirmation is stored locally on this device. No payment is taken.</p></aside></main>
<section id="receipt" class="receipt hidden"><h2>Order received!</h2><p id="receipttext"></p><button class="primary" onclick="newOrder()">Start a new order</button></section>
<script>
const menu=[{name:'Burgers',items:[['Classic burger','8.90'],['Cheeseburger','9.50'],['Double burger','12.50']]},{name:'Sides',items:[['French fries','3.50'],['Onion rings','4.20'],['Side salad','3.90']]},{name:'Drinks',items:[['Water','1.50'],['Cola','2.50'],['Coffee','2.20']]},{name:'Desserts',items:[['Ice cream','3.50'],['Brownie','4.00']]}];let category=0,cart=[];
const euro=n=>'€'+Number(n).toFixed(2);function render(){document.querySelector('#categories').innerHTML=menu.map((c,i)=>`<button class="${i===category?'active':''}" onclick="category=${i};render()">${c.name}</button>`).join('');document.querySelector('#products').innerHTML=menu[category].items.map((p,i)=>`<article class="product"><div><h3>${p[0]}</h3><span class="price">${euro(p[1])}</span></div><button class="primary" onclick="add(${i})">Add to order +</button></article>`).join('');document.querySelector('#cartlines').innerHTML=cart.length?cart.map((p,i)=>`<div class="cartline"><span>${p.name} × ${p.qty}</span><span>${euro(p.price*p.qty)} <button onclick="removeItem(${i})">−</button></span></div>`).join(''):'Your cart is empty.';document.querySelector('#total').textContent=euro(cart.reduce((s,p)=>s+p.price*p.qty,0));}
function add(i){let p=menu[category].items[i],found=cart.find(x=>x.name===p[0]);if(found)found.qty++;else cart.push({name:p[0],price:Number(p[1]),qty:1});render()}function removeItem(i){if(--cart[i].qty<=0)cart.splice(i,1);render()}function clearCart(){cart=[];render()}function checkout(){if(!cart.length){alert('Add an item first.');return}let id='H'+Date.now().toString().slice(-7),sum=cart.reduce((s,p)=>s+p.price*p.qty,0),order={id,items:cart,total:sum,created:new Date().toISOString()};let previous=JSON.parse(localStorage.getItem('heseos-orders')||'[]');previous.push(order);localStorage.setItem('heseos-orders',JSON.stringify(previous));document.querySelector('#ordering').classList.add('hidden');document.querySelector('#receipt').classList.remove('hidden');document.querySelector('#receipttext').textContent=`Order ${id} · Total ${euro(sum)}. Your order has been saved on this device.`;cart=[]}function newOrder(){document.querySelector('#receipt').classList.add('hidden');document.querySelector('#ordering').classList.remove('hidden');render()}document.querySelector('#clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});render();
</script></body></html>
