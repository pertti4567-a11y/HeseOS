name: Build HeseOS ISO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'profile/**'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed archiso git rsync
      - name: Check out source
        uses: actions/checkout@v4
      - name: Prepare Archiso profile
        run: |
          mkdir -p build out
          cp -a /usr/share/archiso/configs/releng/. build/
          rsync -a profile/airootfs/ build/airootfs/
          cat profile/packages.x86_64 >> build/packages.x86_64
          sed -i 's/^[[:space:]]*//; s/[[:space:]]*$//' build/packages.x86_64
          sort -u build/packages.x86_64 -o build/packages.x86_64
          sed -i 's/^iso_name=.*/iso_name="heseos"/' build/profiledef.sh
          sed -i 's/^iso_label=.*/iso_label="HESEOS_0.1"/' build/profiledef.sh
          sed -i 's/^iso_publisher=.*/iso_publisher="HeseOS Project"/' build/profiledef.sh
          sed -i 's/^iso_application=.*/iso_application="HeseOS Arch Linux Live ISO"/' build/profiledef.sh
          sed -i 's/^iso_version=.*/iso_version="0.1.0"/' build/profiledef.sh
          sed -i 's/^install_dir=.*/install_dir="heseos"/' build/profiledef.sh
      - name: Build ISO
        run: mkarchiso -v -w /tmp/heseos-work -o out build
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeseOS-ISO
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
